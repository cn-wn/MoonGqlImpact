schema { query: Query mutation: Write }
type Query { issue(id: ID!): Issue }
type Write { createIssue(input: CreateIssueInput!): CreateIssuePayload }
type Issue { id: ID! title: String! }
type CreateIssuePayload { issue: Issue }
input CreateIssueInput {
  repositoryId: ID!
  title: String!
  labelIds: [ID!]
}
