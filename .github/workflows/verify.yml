name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon fmt && moon info --target ${{ matrix.target }} && git diff --exit-code
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOON_HOME: D:/gql-moon
          MOONC_OVERRIDE: D:/gql-moon/bin/moonc.exe
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'D:/gql-moon/bin'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MOON_HOME=D:/gql-moon'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MOONC_OVERRIDE=D:/gql-moon/bin/moonc.exe'
      - run: moon version --all
      - run: moon update
      - name: Check and run native tests (Unix)
        if: runner.os != 'Windows'
        run: moon check --target native --deny-warn && moon test --target native --deny-warn
      - name: Check and run native tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MOON_CC: cl
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          moon check --target native --deny-warn && moon test --target native --deny-warn
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Run documented CLI examples
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/demo.mbtx
      - name: Check scale, repeatability and limits
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/scale.mbtx
      - name: Verify package archive and downstream install
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/release_check.mbtx

      - name: Check out the pinned Relay Todo client
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: relayjs/relay-examples
          ref: 2aa07233ab23e96bf9ccc98de435db069a32b7eb
          path: relay-upstream
          persist-credentials: false
      - name: Rehearse a Relay CI gate with the packaged checker
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/relay_gate.mbtx -- _build/publish/cn-wn-moongqlimpact-0.2.0.zip relay-upstream

      - name: Check out the pinned SWAPI fixture
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: graphql/swapi-graphql
          ref: 8c0bf5868f11fe84942548180751fceeb36bd606
          path: swapi-upstream
          persist-credentials: false
      - name: Verify client impact on the public SWAPI schema
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/swapi.mbtx -- swapi-upstream

      - name: Install the pinned GraphQL.js reference
        if: runner.os == 'Linux'
        run: npm install --prefix _build/graphql-oracle --no-package-lock --ignore-scripts --no-audit --no-fund graphql@16.11.0
      - name: Compare operation validation with GraphQL.js
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/graphql_oracle.mbtx -- _build/graphql-oracle/node_modules/graphql
